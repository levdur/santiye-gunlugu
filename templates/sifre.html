{% extends "base.html" %}
{% block title %}Şifre değiştir · {{ proje_adi }}{% endblock %}
{% block content %}
<form method="post" class="form dar">
  <h1>Şifre değiştir</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Mevcut şifre <input type="password" name="eski" autocomplete="current-password" required></label>
  <label>Yeni şifre (en az 8 karakter) <input type="password" name="yeni" minlength="8" autocomplete="new-password" required></label>
  <label>Yeni şifre tekrar <input type="password" name="yeni2" minlength="8" autocomplete="new-password" required></label>
  <button type="submit" class="dugme">Şifreyi değiştir</button>
</form>
{% endblock %}
