{% extends "base.html" %}
{% block title %}Giriş · {{ proje_adi }}{% endblock %}
{% block content %}
<form method="post" class="form dar">
  <h1>Giriş</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Kullanıcı adı
    <input name="kullanici_adi" autocomplete="username" autocapitalize="none" required autofocus>
  </label>
  <label>Şifre
    <input type="password" name="sifre" autocomplete="current-password" required>
  </label>
  <button type="submit" class="dugme">Giriş yap</button>
  <p class="ikincil">Hesabınız yoksa şantiye yöneticisinden isteyin.</p>
</form>
{% endblock %}
